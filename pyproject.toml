[tool.poetry]
name = "pulsepilot"
version = "0.1.0"
description = "Multi-agent marketing campaign orchestration system"
authors = ["PulsePilot Team"]
readme = "README.md"
packages = [{include = "pulsepilot", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
openai = "^1.54.0"
anthropic = "^0.39.0"
pydantic = "^2.9.0"
python-dotenv = "^1.0.0"
rich = "^13.9.0"
typer = "^0.12.0"
jinja2 = "^3.1.4"
pyyaml = "^6.0.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
black = "^24.10.0"
ruff = "^0.7.0"
mypy = "^1.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
